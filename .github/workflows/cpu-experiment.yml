name: CPU experiment artifacts
on:
  push:
    branches: ['codex/lip-dotprod-experiment']
permissions:
  contents: read
concurrency:
  group: lip-cpu-experiment-${{ github.ref }}
  cancel-in-progress: false
jobs:
  capture:
    if: >-
      github.repository == 'ihearttokyo/Lip' && github.event.repository.private == false &&
      github.event_name == 'push' && github.ref == 'refs/heads/codex/lip-dotprod-experiment' &&
      contains(github.event.head_commit.message, '[cpu-dotprod]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        lipDotprod: ['false', 'true']
    env:
      LIP_DOTPROD: ${{ matrix.lipDotprod }}
      LIP_CPU_ARTIFACT_NAME: Lip-cpu-${{ github.sha }}-dotprod-${{ matrix.lipDotprod }}-${{ github.run_id }}-${{ github.run_attempt }}
      LIP_CPU_EVIDENCE: ${{ runner.temp }}/lip-cpu-${{ github.sha }}-dotprod-${{ matrix.lipDotprod }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          persist-credentials: false
      - name: Check exact experiment opt-in
        run: git log -1 --format=%B | grep -F '[cpu-dotprod]' >/dev/null
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          cache-disabled: true
      - name: Check Gradle wrapper integrity
        run: echo '81a82aaea5abcc8ff68b3dfcb58b3c3c429378efd98e7433460610fecd7ae45f  gradle/wrapper/gradle-wrapper.jar' | sha256sum --check
      - name: Install pinned SDK components
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-36' 'build-tools;36.0.0' 'ndk;30.0.16248370' 'cmake;4.1.2'
      - name: Check native build inputs
        run: |
          test -f third_party/whisper.cpp/CMakeLists.txt
          python3 -B app/src/main/cpp/check_wrapper.py
          "$ANDROID_HOME/cmake/4.1.2/bin/cmake" --version
          "$ANDROID_HOME/cmake/4.1.2/bin/ninja" --version
          "$ANDROID_HOME/ndk/30.0.16248370/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version
      - name: Existing source and fixture checks (no inference)
        run: |
          node docs/app.js --self-test && node --check docs/app.js
          python3 -B -m unittest discover -s eval -p 'test_*.py' -v
      - name: Unit tests, lint, and build this arm
        id: build
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest -PlipDotprod="$LIP_DOTPROD" --no-daemon --max-workers=2
      - name: Reuse compiled cancellation gate and verify generated GGML
        id: compiled
        run: |
          python3 -B - <<'PY'
          import pathlib, subprocess, sys
          sys.path.insert(0, 'eval')
          from cpu_artifacts import compiled_guard, databases
          root = pathlib.Path.cwd()
          exec(compile(compiled_guard(root), '.github/workflows/android.yml:compiled-cancel', 'exec'))
          for database in databases(root).values():
              subprocess.run(['python3', '-B', 'app/src/main/cpp/check_wrapper.py',
                              '--ggml-source', str(database.parent / 'ggml-dotprod')], check=True)
          PY
      - name: Capture bounded artifacts or partial diagnostics (not acceptance)
        if: always()
        env:
          LIP_CPU_GATE_OUTCOME: ${{ steps.build.outcome == 'success' && steps.compiled.outcome == 'success' && 'success' || 'failure' }}
        run: python3 -B eval/cpu_artifacts.py
      - name: Retain public artifacts and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.LIP_CPU_ARTIFACT_NAME }}
          path: ${{ env.LIP_CPU_EVIDENCE }}
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
